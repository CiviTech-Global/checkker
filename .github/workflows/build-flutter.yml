name: Build Flutter Apps

# Builds the Flutter client (checkker_mobile) for every configured platform —
# Android, iOS, Linux, macOS and Windows — on pushes to main and on releases.
# Artifacts are uploaded for every run; on a published release they are also
# attached to the release.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            build: flutter build apk --release
          - target: ios
            os: macos-latest
            build: flutter build ios --release --no-codesign
          - target: linux
            os: ubuntu-latest
            build: flutter build linux --release
          - target: macos
            os: macos-latest
            build: flutter build macos --release
          - target: windows
            os: windows-latest
            build: flutter build windows --release

    defaults:
      run:
        working-directory: checkker_mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev clang cmake pkg-config libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.9
          cache: true

      - name: Enable desktop target
        if: matrix.target == 'linux' || matrix.target == 'macos' || matrix.target == 'windows'
        run: flutter config --enable-${{ matrix.target }}-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        run: ${{ matrix.build }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p ../artifacts
          case "${{ matrix.target }}" in
            android)
              cp build/app/outputs/flutter-apk/app-release.apk ../artifacts/checkker-android.apk
              ;;
            ios)
              tar -czf ../artifacts/checkker-ios-unsigned.tar.gz -C build/ios/iphoneos Runner.app
              ;;
            linux)
              tar -czf ../artifacts/checkker-linux-x64.tar.gz -C build/linux/x64/release/bundle .
              ;;
            macos)
              APP=$(ls build/macos/Build/Products/Release | grep '\.app$' | head -1)
              tar -czf ../artifacts/checkker-macos.tar.gz -C build/macos/Build/Products/Release "$APP"
              ;;
            windows)
              tar -czf ../artifacts/checkker-windows-x64.tar.gz -C build/windows/x64/runner/Release .
              ;;
          esac

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkker-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
