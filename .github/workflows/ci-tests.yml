name: CI - Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      # Each workspace runs its own pinned jest binary; a root-level
      # `npx jest` resolves a different hoisted major version and breaks.
      - name: Run tests - shared package
        if: ${{ !cancelled() }}
        run: npm test -w packages/shared -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/shared-junit.xml

      - name: Run tests - poker package
        if: ${{ !cancelled() }}
        run: npm test -w packages/poker -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/poker-junit.xml

      - name: Run tests - chess package
        if: ${{ !cancelled() }}
        run: npm test -w packages/chess -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/chess-junit.xml

      - name: Run tests - ai-brain package
        if: ${{ !cancelled() }}
        run: npm test -w packages/ai-brain -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/ai-brain-junit.xml

      - name: Run tests - server app
        if: ${{ !cancelled() }}
        run: npm test -w apps/server -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/server-junit.xml

      - name: Run tests - mobile app
        if: ${{ !cancelled() }}
        run: npm test -w apps/mobile -- --ci --coverage --coverageReporters=text --coverageReporters=lcov --coverageReporters=json-summary --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_FILE: ${{ github.workspace }}/test-results/mobile-junit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: |
            packages/*/coverage/
            apps/*/coverage/

      - name: Coverage summary
        if: ${{ always() && runner.os == 'Linux' }}
        shell: bash
        run: |
          echo "## Coverage (lines)" >> "$GITHUB_STEP_SUMMARY"
          for file in packages/*/coverage/coverage-summary.json apps/*/coverage/coverage-summary.json; do
            if [ -f "$file" ]; then
              name=$(echo "$file" | cut -d/ -f1-2)
              pct=$(node -p "require('./$file').total.lines.pct")
              echo "- **$name**: ${pct}%" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Upload JUnit report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Report (${{ matrix.os }})
          path: test-results/*-junit.xml
          reporter: java-junit
          fail-on-error: false
