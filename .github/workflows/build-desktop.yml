name: Build Desktop

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: npx electron-builder install-app-deps
        working-directory: apps/desktop

      - name: Export Expo web
        run: npm run export:web -w apps/mobile

      - name: Bundle game server
        run: npm run bundle -w apps/server

      - name: Build Electron portable
        run: npm run build -w apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Checkker-portable
          path: apps/desktop/dist/Checkker-*-portable.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/Checkker-*-portable.exe
