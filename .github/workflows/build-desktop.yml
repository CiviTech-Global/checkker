name: Build Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

# Electron builds are the slowest job in the matrix; supersede old runs.
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Electron binary
        run: npx electron-builder install-app-deps
        working-directory: apps/desktop

      - name: Export Expo web
        run: npm run export:web -w apps/mobile

      - name: Bundle game server
        run: npm run bundle -w apps/server

      - name: Build Electron portable
        run: npm run build -w apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Checkker-portable
          path: apps/desktop/dist/Checkker-*-portable.exe

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: apps/desktop/dist/Checkker-*-portable.exe
